<main class="app-shell">
  <header class="app-header">
    <div>
      <p class="eyebrow">Task Workflow Management</p>
      <h1>Workflow Board</h1>
      <p class="intro">Create, prioritize, and move work through a focused task workflow.</p>
    </div>
    <div class="app-header__actions">
      <button id="new-task-button" mat-flat-button type="button" (click)="startNewTask()">
        <mat-icon aria-hidden="true">add</mat-icon>
        New task
      </button>
      <span class="api-badge">Angular + .NET</span>
    </div>
  </header>

  <app-task-list />
</main>
