<section
  class="board-column"
  [attr.data-status]="column().status"
  [attr.aria-labelledby]="columnId() + '-heading'"
>
  <header class="board-column__header">
    <div class="board-column__title">
      <mat-icon aria-hidden="true">{{ column().icon }}</mat-icon>
      <div>
        <h3 [id]="columnId() + '-heading'" tabindex="-1">{{ column().title }}</h3>
        <p>{{ column().description }}</p>
      </div>
    </div>
    <span class="task-count" [attr.aria-label]="taskCountLabel()">
      {{ taskItems().length }}
    </span>
  </header>

  <div
    class="task-drop-list"
    cdkDropList
    [id]="columnId()"
    [cdkDropListData]="taskItems()"
    [cdkDropListConnectedTo]="connectedColumnIds()"
    [cdkDropListSortingDisabled]="true"
    (cdkDropListDropped)="dropTask($event)"
  >
    @for (taskItem of taskItems(); track taskItem.id) {
      <app-task-card
        [taskItem]="taskItem"
        [statusOptions]="statusOptions()"
        [isStatusUpdating]="updatingTaskItemIds().has(taskItem.id)"
        [statusError]="statusUpdateErrors()[taskItem.id] ?? null"
        [isDeleting]="deletingTaskItemIds().has(taskItem.id)"
        [deleteError]="deleteErrors()[taskItem.id] ?? null"
        (editRequested)="editRequested.emit(taskItem)"
        (deleteRequested)="deleteRequested.emit(taskItem)"
        (moveRequested)="requestMove(taskItem, $event)"
      />
    } @empty {
      <div class="column-empty">
        <mat-icon aria-hidden="true">space_dashboard</mat-icon>
        <span>Drop a task here</span>
      </div>
    }
  </div>
</section>
